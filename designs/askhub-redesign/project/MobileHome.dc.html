<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>AskHub - Mobile trang chủ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--page:#f5f7fa;--sub:#eef2f5;--text:#172b3a;--mut:#5b6b7a;--bd:#e1e7ec;--p:#087f73;--pd:#066a5f;--ps:#e6f5f3;--chrome:#103f3a;--acc:#ff781f}
body{margin:0;font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.6;color:var(--text);background:var(--page);-webkit-font-smoothing:antialiased}
a{color:var(--pd);text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:844px;overflow-y:auto;overflow-x:hidden;background:var(--page);display:flex;flex-direction:column">

<header style="flex:none;height:60px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;padding:0 12px 0 8px">
<button aria-label="Mở menu" style="width:44px;height:44px;border:0;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<div style="width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#0fa090,#087f73);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center">A</div>
<b style="font-size:17px;flex:1">AskHub</b>
<button aria-label="Tìm kiếm" style="width:44px;height:44px;border:0;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
<a href="Ask.dc.html" aria-label="Đặt câu hỏi" style="width:44px;height:44px;border-radius:12px;background:var(--acc);color:#2a1200;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
</header>

<div style="padding:16px;display:flex;flex-direction:column;gap:16px">
<section style="border-radius:16px;background:linear-gradient(135deg,#087f73 0%,#103f3a 100%);color:#fff;padding:20px">
<h1 style="margin:0 0 6px;font-size:22px;line-height:1.25;font-weight:800">Hỏi gì cũng có người trả lời.</h1>
<p style="margin:0 0 14px;font-size:14px;color:rgba(255,255,255,.82)">Cộng đồng hỏi đáp lập trình cho sinh viên.</p>
<div style="display:flex;gap:16px;font-variant-numeric:tabular-nums">
<div><b style="font-size:18px">1.248</b><div style="font-size:12px;color:rgba(255,255,255,.8)">Câu hỏi</div></div>
<div><b style="font-size:18px">3.906</b><div style="font-size:12px;color:rgba(255,255,255,.8)">Trả lời</div></div>
<div><b style="font-size:18px">512</b><div style="font-size:12px;color:rgba(255,255,255,.8)">Thành viên</div></div></div></section>

<div style="display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<a href="MobileHome.dc.html" style="flex:none;height:36px;padding:0 14px;border-radius:9999px;border:1px solid {{c.bd}};background:{{c.bg}};color:{{c.fg}};font-size:13.5px;font-weight:500;display:flex;align-items:center">{{c.n}}</a>
</sc-for></div>

<div style="display:flex;align-items:center;justify-content:space-between"><h2 style="margin:0;font-size:20px;font-weight:600">Câu hỏi mới nhất</h2>
<button style="height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--bd);background:#fff;font-family:inherit;font-size:13px;font-weight:500;color:var(--text)">Sắp xếp</button></div>

<div style="display:flex;flex-direction:column;gap:10px">
<sc-for list="{{questions}}" as="q" hint-placeholder-count="4">
<article style="background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px 16px">
<h3 style="margin:0 0 8px;font-size:16px;line-height:1.35;font-weight:600"><a href="MobileQuestion.dc.html" style="color:var(--text)">{{q.title}}</a></h3>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px"><span style="font-size:12px;font-weight:600;background:var(--ps);color:var(--pd);border-radius:9999px;padding:2px 10px">{{q.cat}}</span><span style="font-size:12px;font-weight:500;background:var(--sub);color:#3d4f5e;border-radius:9999px;padding:2px 10px">{{q.tag}}</span></div>
<div style="display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums">
<span><b style="color:var(--text)">{{q.votes}}</b> vote</span>
<span style="color:{{q.afg}};font-weight:{{q.aw}}"><b>{{q.answers}}</b> trả lời</span>
<span style="flex:1;text-align:right">{{q.author}} · {{q.time}}</span></div>
</article>
</sc-for></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const qs = [
      ['Làm thế nào để sử dụng useEffect trong React mà không bị lặp vô hạn?','ReactJS','useEffect',12,3,'Nguyễn Văn An','2 giờ',true],
      ['Sự khác nhau giữa INNER JOIN và LEFT JOIN trong MySQL?','Database','mysql',9,2,'Trần Thị Bình','4 giờ',true],
      ['Tại sao Node.js sử dụng Event Loop?','NodeJS','event-loop',21,5,'Lê Minh Cường','6 giờ',true],
      ['Kết nối React với Express và xử lý CORS thế nào?','ReactJS','cors',6,0,'Phạm Đức Dũng','Hôm qua',false]
    ];
    return {
      cats: ['Tất cả','JavaScript','ReactJS','NodeJS','Database','Python','Java'].map((n, i) => ({ n, bg: i === 0 ? '#087f73' : '#fff', fg: i === 0 ? '#fff' : '#172b3a', bd: i === 0 ? '#087f73' : '#e1e7ec' })),
      questions: qs.map((q) => ({ title: q[0], cat: q[1], tag: q[2], votes: q[3], answers: q[4], author: q[5], time: q[6], afg: q[7] ? '#15803d' : '#5b6b7a', aw: q[7] ? 600 : 400 }))
    };
  }
}
</script>
</body>
</html>
