<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>AskHub - Mobile quản trị</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--page:#f5f7fa;--sub:#eef2f5;--text:#172b3a;--mut:#5b6b7a;--bd:#e1e7ec;--p:#087f73;--pd:#066a5f;--ps:#e6f5f3}
body{margin:0;font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.6;color:var(--text);background:var(--page);-webkit-font-smoothing:antialiased}
</style>
</helmet>
<div style="width:390px;height:844px;overflow-y:auto;overflow-x:hidden;background:var(--page);display:flex;flex-direction:column">
<header style="flex:none;height:60px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;padding:0 12px 0 8px">
<button aria-label="Mở menu" style="width:44px;height:44px;border:0;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<b style="font-size:17px;flex:1">Quản trị</b>
<span style="width:34px;height:34px;border-radius:50%;background:#fdba74;color:#5a2d0c;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">AD</span></header>

<div style="padding:16px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<span style="flex:none;height:38px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:600;display:flex;align-items:center;background:{{t.bg}};color:{{t.fg}};border:1px solid {{t.bd}}">{{t.n}}</span>
</sc-for></div>

<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
<div style="background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px">
<div style="font-size:12.5px;color:var(--mut);font-weight:500">{{s.l}}</div>
<div style="font-size:24px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;margin-top:2px">{{s.v}}</div>
<div style="font-size:12px;color:#15803d;font-weight:500">{{s.d}}</div></div>
</sc-for></div>

<section style="background:#fff;border:1px solid var(--bd);border-radius:14px;overflow:hidden">
<h2 style="margin:0;padding:14px 16px;font-size:15px;font-weight:700;color:var(--pd)">Người dùng gần đây</h2>
<sc-for list="{{users}}" as="u" hint-placeholder-count="4">
<div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--bd)">
<span style="flex:none;width:36px;height:36px;border-radius:50%;background:{{u.bg}};color:{{u.fg}};font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">{{u.ab}}</span>
<div style="flex:1;min-width:0;line-height:1.3"><div style="font-weight:600;font-size:14px">{{u.name}}</div><div style="font-size:12.5px;color:var(--mut)">{{u.rep}} điểm</div></div>
<span style="font-size:12px;font-weight:600;border-radius:9999px;padding:2px 10px;background:{{u.sbg}};color:{{u.sfg}}">{{u.status}}</span>
<button aria-label="Thao tác" style="width:44px;height:44px;border:0;background:transparent;color:var(--mut)"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button></div>
</sc-for></section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const us = [['Nguyễn Văn An','NA','1.935',true,'#d6f0ec','#066a5f'],['Trần Thị Bình','TB','1.720',true,'#ffe3d0','#9a4208'],['Lê Minh Cường','LC','2.480',true,'#e0e7ff','#3730a3'],['Phạm Đức Dũng','PD','312',false,'#fde7f3','#9d174d']];
    return {
      tabs: ['Tổng quan','Người dùng','Câu hỏi','Trả lời','Danh mục','Báo cáo'].map((n, i) => ({ n, bg: i === 0 ? '#e6f5f3' : '#fff', fg: i === 0 ? '#066a5f' : '#172b3a', bd: i === 0 ? '#9fd6cf' : '#e1e7ec' })),
      stats: [{ l: 'Người dùng', v: '512', d: '+18 tuần này' }, { l: 'Câu hỏi', v: '1.248', d: '+64 tuần này' }, { l: 'Câu trả lời', v: '3.906', d: '+212 tuần này' }, { l: 'Bình luận', v: '5.120', d: '+305 tuần này' }],
      users: us.map((u) => ({ name: u[0], ab: u[1], rep: u[2], status: u[3] ? 'Hoạt động' : 'Bị khóa', sbg: u[3] ? '#e6f0ea' : '#fdecea', sfg: u[3] ? '#15803d' : '#b4232c', bg: u[4], fg: u[5] }))
    };
  }
}
</script>
</body>
</html>
